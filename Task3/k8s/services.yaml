apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
        - name: service-a
          image: service-a:latest
          env:
            - name: OTEL_SERVICE_NAME
              value: service-a   # для service-b поменять на service-b
            - name: OTEL_TRACES_EXPORTER
              value: jaeger
            - name: OTEL_EXPORTER_JAEGER_PROTOCOL
              value: grpc
            - name: OTEL_EXPORTER_JAEGER_ENDPOINT
              value: http://simplest-collector.observability:14250
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: service-a
spec:
  selector:
    app: service-a
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
    spec:
      containers:
        - name: service-b
          image: service-b:latest
          env:
            - name: OTEL_SERVICE_NAME
              value: service-b
            - name: OTEL_TRACES_EXPORTER
              value: jaeger
            - name: OTEL_EXPORTER_JAEGER_PROTOCOL
              value: grpc
            - name: OTEL_EXPORTER_JAEGER_ENDPOINT
              value: http://simplest-collector.observability:14250
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: service-b
spec:
  selector:
    app: service-b
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
